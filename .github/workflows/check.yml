name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - run: npm test
      - run: npm run test:python
      - run: npm pack --dry-run
